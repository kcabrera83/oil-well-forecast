site_name: Oil Well Forecast
site_description: Production decline curve analysis using Arps methodology with anomaly detection.
repo_url: https://github.com/kcabrera83/oil-well-forecast
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
